name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# F-47 (OpenSSF Token-Permissions): least-privilege default for GITHUB_TOKEN across
# all jobs — these only read the checkout. Jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  # Fast gate on every PR and push: typecheck, lint, unit tests. Integration tests need a
  # Postgres service and run in the `integration` job below — running the full suite here
  # (no DATABASE_URL) fails at collection for the integration files that open a connection
  # eagerly, so this job runs the unit suite only.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:unit

  # Integration tests (TST-01 isolation, and future TST-05/08/11/12) run on every
  # merge against an ephemeral Postgres — never the cloud dev/prod project.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm run test:integration

  # Heavier checks run on main only: end-to-end and performance. The app is built +
  # served against an ephemeral Postgres (migrated), so the smoke journey exercises a
  # real DB. The full authenticated TST-07 journey self-skips until a dev Supabase Auth
  # project + its dev-mailbox OTP are wired here (owner reality-gate) — set the
  # NEXT_PUBLIC_SUPABASE_* + SUPABASE_SERVICE_ROLE_KEY secrets to activate it.
  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      APP_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e

  # Lighthouse performance gate (FEP-08, soft gate) — enabled once the dashboard
  # and portal routes exist (WP-003/004+). Kept as a documented placeholder so the
  # main-only performance step is wired but does not fail an empty app.
  # lighthouse:
