  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: treosh/lighthouse-ci-action@v12
  #       with:
  #         urls: |
  #           http://localhost:3000/admin
  #           http://localhost:3000/portal
  #         configPath: ./lighthouserc.json
