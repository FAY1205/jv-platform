# pnpm build-script policy (pnpm 11 reads this here, not from package.json).
# These three ship native binaries / prebuild steps we rely on:
#   esbuild        — Vitest's bundler
#   sharp          — Next.js image optimization
#   unrs-resolver  — eslint-config-next's import resolver
allowBuilds:
  # ADR-0032: @sentry/nextjs depends transitively on @sentry/cli (via
  # @sentry/bundler-plugins) for source-map upload. Denying the build only skips
  # @sentry/cli's own postinstall CDN-fallback download — the platform binary
  # (@sentry/cli-win32-x64, ~12 MB) still installs via optionalDependencies either way.
  # What actually keeps it inert is that next.config.ts is NOT wrapped with
  # withSentryConfig, so the bundler plugin never invokes it. Flip to true only together
  # with adding withSentryConfig + SENTRY_AUTH_TOKEN to ship source maps to Sentry.
  '@sentry/cli': false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Hoist Sentry/OpenTelemetry's dynamic-instrumentation loaders to the root node_modules.
# @opentelemetry/instrumentation (via @sentry/nextjs) resolves `import-in-the-middle` and
# `require-in-the-middle` from the project root at build/runtime; pnpm's strict layout can
# leave them unreachable there, which 500s local `next dev` ("Module not found:
# 'import-in-the-middle'") and makes Sentry-touching Vitest files fail to load. Root-hoisting
# guarantees they resolve. (Vercel builds fine regardless; this hardens local dev + tests.)
publicHoistPattern:
  - '*-in-the-middle'

# Transitive-dependency security overrides (audit F-46). Two moderate advisories with
# no fix available from the parent's pinned range:
#   postcss <8.5.10 (via next)   — GHSA-qx2v-qp2m-jg93 (CSS stringify XSS)
#   uuid <11.1.1 (via exceljs)   — GHSA-w5hq-g745-h8pq (buffer bounds check)
overrides:
  postcss@<8.5.10: '>=8.5.10'
  uuid@<11.1.1: '>=11.1.1'
